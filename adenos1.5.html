.win{background:var(--gl);backdrop-filter:blur(var(--bl,34px)) saturate(190%);-webkit-backdrop-filter:blur(var(--bl,34px)) saturate(190%);border-radius:22px;box-shadow:inset 0 1.5px 0 var(--gh),inset 0 0 0 1px rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.35)}
.win::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;background:radial-gradient(260px circle at var(--mx,25%) var(--my,0),rgba(255,255,255,.2),transparent 70%)}

#dock{border-radius:30px;padding:8px 10px}#cc,.box,.toast{border-radius:22px}#ctx{border-radius:16px}
.di{box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 4px rgba(0,0,0,.15),0 5px 12px rgba(0,0,0,.3)}.di::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.5),transparent 55%);pointer-events:none}
.bt{background:var(--gh);box-shadow:inset 0 .5px 0 rgba(255,255,255,.6),0 1px 3px rgba(0,0,0,.12);border-radius:14px}

#ck{cursor:pointer}:root.lt{--fs:17px}.rm *,.rm *::before{animation:none!important;transition:none!important}
.hc .win,.hc #dock,.hc #mb,.hc #cc,.hc #nc,.hc #ctx,.hc .box,.hc .toast{background:#fff!important;color:#000!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}.hc .win::before{display:none}

#aq{width:min(420px,90%);padding:10px 16px;border:0;border-radius:20px;outline:0;background:rgba(255,255,255,.22);color:#fff;font-size:16px;text-align:center;-webkit-user-select:text;user-select:text}#aq::placeholder{color:rgba(255,255,255,.7)}
#ag{flex:1;overflow:auto;width:min(880px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px;align-content:start;padding:10px}
.la{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;text-align:center}.la .si3{width:64px;height:64px;font-size:34px;border-radius:16px}
.di{width:var(--ds,48px);height:var(--ds,48px);font-size:calc(var(--ds,48px)*.58)}@media(max-width:480px){:root{--ds:32px}}

/* ===== Animaciones ===== */
@keyframes wopen{from{opacity:0;transform:scale(.18)}55%{opacity:1}}
@keyframes wout{to{opacity:0;transform:scale(.12)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes bnc{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px)}55%{transform:translateY(0)}72%{transform:translateY(-9px)}}
@keyframes dpop{from{opacity:0;transform:scale(.3) translateY(20px)}}
@keyframes dot{from{transform:scale(0)}}
@keyframes tin{from{opacity:0;transform:translateX(44px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateX(44px) scale(.95)}}
@keyframes mpop{from{opacity:0;transform:scale(.92) translateY(-6px)}}
@keyframes slin{from{opacity:0;transform:translateY(-10px) scale(.94)}}
@keyframes sp{from{opacity:0;transform:scale(.92) translateY(-12px)}}
@keyframes fadein{from{opacity:0}}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes ring{from{transform:scale(.9);opacity:.8}to{transform:scale(1.55);opacity:0}}
@keyframes bpulse{50%{transform:scale(1.1);filter:drop-shadow(0 0 26px #8f9bff)}}
@keyframes float{to{transform:translate(7%,5%) rotate(8deg)}}
html{scroll-behavior:smooth}.bd,.sg,#ag{scroll-behavior:smooth}
.win{animation:wopen .5s cubic-bezier(.2,.9,.3,1.12);transition:opacity .3s,transform .45s cubic-bezier(.2,.9,.3,1.15),box-shadow .3s}
.win.cls{animation:wout .28s cubic-bezier(.5,0,.75,0) forwards}
.win.min{transform:scale(.06);transition:opacity .35s ease-in,transform .45s cubic-bezier(.5,0,.75,0)}
.win.inact{box-shadow:inset 0 1.5px 0 var(--gh),0 8px 26px rgba(0,0,0,.22)}
.win.drag{transform:scale(1.012);box-shadow:inset 0 1.5px 0 var(--gh),0 44px 100px rgba(0,0,0,.5)}
.win.anim{transition:left .38s cubic-bezier(.2,.9,.3,1),top .38s cubic-bezier(.2,.9,.3,1),width .38s cubic-bezier(.2,.9,.3,1),height .38s cubic-bezier(.2,.9,.3,1),border-radius .3s,opacity .3s,transform .45s cubic-bezier(.2,.9,.3,1.15)}
.di{animation:dpop .5s cubic-bezier(.2,.9,.3,1.4) backwards}.di.bnc{animation:bnc .65s cubic-bezier(.3,0,.4,1)}.di.run::after{animation:dot .35s cubic-bezier(.2,.9,.3,1.6)}
#dock{transition:bottom .25s,opacity .6s,translate .7s cubic-bezier(.2,.9,.3,1)}#mb{transition:opacity .5s,translate .6s cubic-bezier(.2,.9,.3,1)}
#lb{z-index:99993;transition:transform .35s cubic-bezier(.2,.9,.3,1.4),opacity .5s,scale .6s cubic-bezier(.2,.9,.3,1.4)}#lb:active{transform:scale(.88)}#lb.on{transform:rotate(180deg) scale(1.12)}
#lb::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:ring 2s 3;pointer-events:none}
body:not(.rd) #dock{opacity:0;translate:0 70px}body:not(.rd) #mb{opacity:0;translate:0 -30px}body:not(.rd) #lb{opacity:0;scale:.5}body:not(.rd) #ic{opacity:0}#ic{transition:opacity .8s .3s}
#am{display:flex;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.12);backdrop-filter:blur(0) saturate(100%);-webkit-backdrop-filter:blur(0) saturate(100%);background:rgba(10,10,24,0);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.3,1),backdrop-filter .5s,-webkit-backdrop-filter .5s,background .5s,visibility 0s .5s}

#aq,#af,#ap{opacity:0;transform:translateY(-18px);transition:opacity .4s .1s,transform .5s .1s cubic-bezier(.2,.9,.3,1)}#ap{transform:translateY(18px);transition-delay:.25s}#af{transition-delay:.17s}

#cc,#nc{animation:slin .3s cubic-bezier(.2,.9,.3,1.1);transform-origin:top right}#ctx{animation:mpop .18s cubic-bezier(.2,.9,.3,1.1);transform-origin:top left}.ci{transition:background .12s}
